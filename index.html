<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chess, by hand</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 2 2'%3E%3Crect width='1' height='1'/%3E%3Crect x='1' y='1' width='1' height='1'/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="win">
  <div class="bar"><span>Chess, by hand</span></div>

  <nav class="menu">
    <button id="nav-draw" type="button">Draw</button>
    <button id="nav-play" type="button">Play</button>
  </nav>

  <!-- 1. draw the pieces -->
  <section id="draw" class="pane">
    <div class="drawing">
      <div class="left">
        <div class="stage"><div class="box"><canvas id="pad" width="800" height="800" aria-label="Drawing box"></canvas></div></div>
        <p class="tools">
          <button id="undo-stroke" type="button">Undo stroke</button>
          <button id="clear" type="button">Clear</button>
        </p>
      </div>

      <div class="ask">
        <p id="step"></p>
        <h1 id="prompt"></h1>
        <p id="hint"></p>
        <p class="go"><button id="next" type="button"></button></p>
        <hr>
        <ul id="shelf" class="shelf"></ul>
        <hr>
        <p class="note">The box is one square of the board. Close your outline and it gets filled in.</p>
      </div>
    </div>
  </section>

  <!-- 2. play with them -->
  <section id="play" class="pane" hidden>
    <div class="game">
      <div class="stage">
        <div class="bw">
          <div id="ranks" class="ranks"></div>
          <div>
            <div id="squares" class="squares" role="group" aria-label="Chess board"></div>
            <div id="files" class="files"></div>
          </div>
        </div>
      </div>

      <div class="panel">
        <p id="state"></p>
        <p id="promo" hidden></p>
        <hr>
        <p>Opponent: <button data-mode="cpu" type="button">computer</button> / <button data-mode="human" type="button">person</button></p>
        <p id="side-row">You play: <button data-side="0" type="button">white</button> / <button data-side="1" type="button">black</button></p>
        <p class="acts">
          <button id="new" type="button">New game</button>
          <button id="undo" type="button">Undo</button>
          <button id="flip" type="button">Flip board</button>
          <button id="resign" type="button">Resign</button>
        </p>
        <hr>
        <div id="took-w" class="took"></div>
        <div id="took-b" class="took"></div>
        <hr>
        <div id="moves" class="moves" tabindex="0" aria-label="Moves"></div>
        <p class="copy"><button id="copy" type="button">Copy moves</button></p>
      </div>
    </div>
  </section>

  <div id="msg" class="status" role="status"></div>
</div>

<script src="engine.js"></script>
<script src="app.js"></script>
</body>
</html>
